#Quartermasters Hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitQM
  name: quartermaster's antique salvage hardsuit helmet
  description: A salvaged pirate helmet generously donated to NanoTrasen, retrofitted for the Quartermaster.
  components:
  - type: Sprite
    sprite: _Harmony/Clothing/Head/Hardsuits/qmsuit.rsi
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableLightVisuals
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vox:
      - state: equipped-head-light-vox
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-head-vox
      - state: equipped-head-unshaded-vox
        shader: unshaded
  - type: PointLight
    radius: 6
    color: "#67ffe2"
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000

# Damned Corsair Hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitDamnedCorsair
  name: pirate captain's spectral hardsuit helmet
  suffix: Pirate
  description: A spectral hardsuit helmet, made for the damned captain of a ghost ship.
  components:
  - type: Sprite
    sprite: Clothing/Head/Hardsuits/piratecaptainhelm.rsi
  - type: ToggleableLightVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-light
        shader: unshaded
      head-vox:
      - state: equipped-HELMET-light-vox
        shader: unshaded
  - type: Clothing
    sprite: Clothing/Head/Hardsuits/piratecaptainhelm.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-HELMET-vox
      - state: equipped-HELMET-unshaded-vox
        shader: unshaded
  - type: PointLight # Color matches visor colors, radius/energy same as mining hardsuit for the big captain.
    color: "#f3ea9c"
    radius: 7
    energy: 3
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
