
# Spectral Cutlass, Slow wide swing with high damage per hit
- type: entity
  name: spectral cutlass
  parent: [BaseMeleeWeaponEnergy, BaseSpectralContraband]
  id: SpectralCutlass
  description: A cutlass infused with the souls of the damned.
  components:
  - type: ItemToggleMeleeWeapon
    activatedDamage:
        types:
            Slash: 16
            Cold: 14
    deactivatedSecret: true
  - type: Sprite
    sprite: Objects/Weapons/Melee/e_cutlass.rsi
    layers:
      - state: e_cutlass
      - state: e_cutlass_blade
        color: blue
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: Item
    sprite: Objects/Weapons/Melee/e_cutlass.rsi

# Spectral Harpoon, Faster spear swing with lower damage per hit
- type: entity
  name: spectral harpoon
  parent: [BaseItem, BaseSpectralContraband]
  id: SpectralSpear
  description: A boarding pike infused with the souls of the damned.
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/spear.rsi
    layers:
    - state: spear
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Piercing: 12
        Cold: 10
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage

# Boneclaws, Fast wide swing with low damage per hit
- type: entity
  parent: [ClothingHandsKnuckleDusters, BaseSpectralContraband]
  id: ClothingHandsSpectralKnuckleDusters
  name: boneclaws
  description: Skeletal knuckledusters infused with the souls of the damned.
  components:
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 3
    damage:
      types:
        Blunt: 8
        Cold: 4
    angle: 30
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true
